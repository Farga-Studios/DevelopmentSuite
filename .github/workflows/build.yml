name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test tests/Suite.Updater.Tests -c Release
      - run: dotnet pack src/Suite.Updater -c Release -o packages
      - uses: actions/upload-artifact@v4
        with:
          name: suite-updater-candidate
          path: packages/*.nupkg
