name: Build
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
          global-json-file: global.json
      - run: dotnet test tests/Suite.Updater.Tests -c Release --framework net8.0
      - run: dotnet test tests/Suite.Updater.Tests -c Release --framework net10.0
      - run: dotnet pack src/Suite.Updater -c Release -o packages
      - name: Verify package target frameworks
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-Item packages/FargaStudios.Suite.Updater.0.2.0.nupkg
          $zip = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            foreach ($tfm in @('net8.0','net10.0')) {
              if (-not $zip.GetEntry("lib/$tfm/Suite.Updater.dll")) { throw "Missing $tfm assembly" }
            }
          } finally { $zip.Dispose() }
      - uses: actions/upload-artifact@v4
        with:
          name: suite-updater-0.2.0-candidate
          path: packages/*.nupkg
          if-no-files-found: error
